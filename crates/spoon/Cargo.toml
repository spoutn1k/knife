[package]
name = "spoon"
description = "Web frontend for the knife recipe book, compiled to wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
dioxus = { version = "0.7.10", features = ["router", "web"] }
knife-core.workspace = true
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
reqwest = { version = "0.13.5", default-features = false, features = ["form", "json", "query"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
web-sys = { version = "0.3", features = [
  "Document", "Element", "EventTarget", "HtmlElement", "KeyboardEvent", "Location", "Storage", "Window",
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
nucleo-matcher = "0.3.1"
unicode-segmentation = "1.13.3"
