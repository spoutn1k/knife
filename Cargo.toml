[workspace]
resolver = "3"
members = ["crates/knife-core", "crates/knife-server"]

[workspace.package]
version = "0.4.0"
edition = "2024"
authors = ["Jean-Baptiste Skutnik <jb.skutnik@gmail.com>"]
license = "MIT"

[workspace.dependencies]
knife-core = { path = "crates/knife-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
